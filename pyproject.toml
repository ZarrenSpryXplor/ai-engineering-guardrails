[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-engineering-guardrails"
dynamic = ["version"]
description = "Vendor-neutral local guardrails for AI engineering workstations"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "AI Engineering Guardrails contributors"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
]
dependencies = []

[project.urls]
Source = "https://github.com/ZarrenSpryXplor/ai-engineering-guardrails"
Issues = "https://github.com/ZarrenSpryXplor/ai-engineering-guardrails/issues"

[project.scripts]
ai-guardrails = "ai_engineering_guardrails.cli:main"

[tool.setuptools.dynamic]
version = {attr = "ai_engineering_guardrails.__version__"}

[tool.setuptools]
# The resource tree is data, not a collection of implicit namespace packages.
# Its complete wheel contents are declared explicitly below.
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_engineering_guardrails*"]
namespaces = false

[tool.setuptools.package-data]
ai_engineering_guardrails = ["_resources/**/*"]
