name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate release distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out published release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install exact CI tooling
        run: python -m pip install --requirement requirements-ci.txt

      - name: Check release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python tools/ci.py release-tag --tag "$RELEASE_TAG"

      - name: Build generated output
        run: python tools/guardrails.py build

      - name: Check generated output is committed
        run: git diff --exit-code -- adapters dist

      - name: Validate canonical and generated data
        run: python tools/ci.py validate

      - name: Run complete unit test suite
        run: python tools/ci.py test discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall ai_engineering_guardrails tools enforcement

      - name: Build source distribution and wheel
        run: python -m build --no-isolation --outdir release

      - name: Check distribution metadata and README rendering
        run: python -m twine check --strict release/*

      - name: Check publication artifact set
        run: python tools/ci.py release-artifacts --directory release

      - name: Check whitespace errors
        run: git diff --check

      - name: Scan repository
        run: python tools/guardrails.py scan --repo . --format human

      - name: Upload validated release distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-distributions-${{ github.event.release.tag_name }}-${{ github.run_id }}
          path: |
            release/*.whl
            release/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish validated distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/ai-engineering-guardrails
    permissions:
      id-token: write

    steps:
      - name: Download validated release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-distributions-${{ github.event.release.tag_name }}-${{ github.run_id }}
          path: release

      - name: Confirm only expected distributions are present
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          entries=(release/*)
          wheels=(release/ai_engineering_guardrails-*.whl)
          sdists=(
            release/ai-engineering-guardrails-*.tar.gz
            release/ai_engineering_guardrails-*.tar.gz
          )
          if [ "${#entries[@]}" -ne 2 ] || [ "${#wheels[@]}" -ne 1 ] || [ "${#sdists[@]}" -ne 1 ]; then
            echo "error: release artifact must contain exactly one ai-engineering-guardrails wheel and one source distribution" >&2
            exit 1
          fi
          for distribution in "${entries[@]}"; do
            [ -f "$distribution" ] || { echo "error: release artifact contains a non-file entry" >&2; exit 1; }
          done

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release/
