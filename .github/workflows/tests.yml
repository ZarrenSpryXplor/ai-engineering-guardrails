name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install package build tooling
        id: tooling
        run: python -m pip install --requirement requirements-ci.txt

      - name: Build generated output
        id: build
        run: python tools/guardrails.py build

      - name: Check generated output is committed
        id: generated
        run: git diff --exit-code -- adapters dist

      - name: Validate canonical and generated data
        id: validate
        env:
          CI_VALIDATION_SUMMARY_TITLE: Repository validation
          CI_SUMMARY_PLATFORM: Ubuntu / Python 3.11
        run: python tools/ci.py validate

      - name: Run tests
        id: unit_tests
        env:
          CI_TEST_SUMMARY_TITLE: Unit tests
          CI_SUMMARY_PLATFORM: Ubuntu / Python 3.11
        run: python tools/ci.py test discover -s tests -v

      - name: Compile Python sources
        id: compile
        run: python -m compileall ai_engineering_guardrails tools enforcement

      - name: Build source distribution and wheel
        id: package
        run: python -m build --no-isolation --outdir release

      - name: Check distribution metadata and README rendering
        id: metadata
        run: python -m twine check release/*

      - name: Check whitespace errors
        id: whitespace
        run: git diff --check

      - name: Scan repository
        id: scan
        run: python tools/guardrails.py scan --repo . --format human

      - name: Upload validated distributions
        id: upload_distributions
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions-${{ github.sha }}-${{ github.run_attempt }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

      - name: Summarize job
        if: always()
        env:
          CI_SUMMARY_TITLE: Primary tests
          CI_SUMMARY_RESULT: ${{ job.status }}
          CI_SUMMARY_PLATFORM: Ubuntu / Python 3.11
          CI_SUMMARY_CHECKS: |
            Checkout=${{ steps.checkout.outcome }}
            Set up Python=${{ steps.setup_python.outcome }}
            Install tooling=${{ steps.tooling.outcome }}
            Build generated output=${{ steps.build.outcome }}
            Generated output committed=${{ steps.generated.outcome }}
            Validate=${{ steps.validate.outcome }}
            Unit tests=${{ steps.unit_tests.outcome }}
            Compile=${{ steps.compile.outcome }}
            Build distributions=${{ steps.package.outcome }}
            Distribution metadata=${{ steps.metadata.outcome }}
            Whitespace=${{ steps.whitespace.outcome }}
            Repository scan=${{ steps.scan.outcome }}
            Distribution artifact=${{ steps.upload_distributions.outcome }}
        run: python tools/ci.py summary

  newest-python:
    name: Compatibility (Python 3.14)
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up newest supported Python
        id: setup_python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install test tooling
        id: tooling
        run: python -m pip install --requirement requirements-ci.txt

      - name: Validate current Python support
        id: validate
        env:
          CI_VALIDATION_SUMMARY_TITLE: Python 3.14 validation
          CI_SUMMARY_PLATFORM: Ubuntu / Python 3.14
        run: python tools/ci.py validate

      - name: Test current Python support
        id: unit_tests
        env:
          CI_TEST_SUMMARY_TITLE: Python 3.14 compatibility tests
          CI_SUMMARY_PLATFORM: Ubuntu / Python 3.14
        run: python tools/ci.py test discover -s tests -v

      - name: Summarize job
        if: always()
        env:
          CI_SUMMARY_TITLE: Python 3.14 compatibility
          CI_SUMMARY_RESULT: ${{ job.status }}
          CI_SUMMARY_PLATFORM: Ubuntu / Python 3.14
          CI_SUMMARY_CHECKS: |
            Checkout=${{ steps.checkout.outcome }}
            Set up Python=${{ steps.setup_python.outcome }}
            Install tooling=${{ steps.tooling.outcome }}
            Validate=${{ steps.validate.outcome }}
            Unit tests=${{ steps.unit_tests.outcome }}
        run: python tools/ci.py summary

  wheel-smoke:
    name: Wheel smoke (${{ matrix.os }})
    needs: tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install package build tooling
        id: tooling
        run: python -m pip install --requirement requirements-ci.txt

      - name: Build and smoke-test the installed wheel
        id: package_smoke
        env:
          CI_TEST_SUMMARY_TITLE: Installed wheel smoke test
          CI_SUMMARY_PLATFORM: ${{ runner.os }} / Python 3.11
        run: python tools/ci.py test tests.test_packaging.PackagingTests.test_wheel_and_sdist_work_outside_source_checkout -v

      - name: Exercise IDE adapter path simulations
        id: ide_tests
        if: always() && steps.tooling.outcome == 'success'
        env:
          CI_TEST_SUMMARY_TITLE: IDE adapter tests
          CI_SUMMARY_PLATFORM: ${{ runner.os }} / Python 3.11
        run: python tools/ci.py test tests.test_ide_adapters -v

      - name: Summarize job
        if: always()
        env:
          CI_SUMMARY_TITLE: Wheel smoke (${{ matrix.os }})
          CI_SUMMARY_RESULT: ${{ job.status }}
          CI_SUMMARY_PLATFORM: ${{ runner.os }} / Python 3.11
          CI_SUMMARY_CHECKS: |
            Checkout=${{ steps.checkout.outcome }}
            Set up Python=${{ steps.setup_python.outcome }}
            Install tooling=${{ steps.tooling.outcome }}
            Installed wheel smoke=${{ steps.package_smoke.outcome }}
            IDE adapter tests=${{ steps.ide_tests.outcome }}
        run: python tools/ci.py summary
